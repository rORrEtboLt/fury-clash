name: iOS Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'fury-clash-client/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Relay server WebSocket URL (ws://YOUR_IP:3002)'
        required: false
        default: 'ws://192.168.1.100:3002'

# ── What this produces ────────────────────────────────────────────────────
# If IOS_CERTIFICATE_P12 / IOS_PROVISIONING_PROFILE secrets are set:
#   → signed .ipa  →  install directly: ideviceinstaller -i FuryClash.ipa
# Otherwise:
#   → unsigned .ipa  →  needs AltStore / AltServer-Linux to re-sign on install

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14       # Apple Silicon Mac, Xcode 15+

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode ─────────────────────────────────────────────────
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 3. Build SDL3 for iOS (arm64 device) ────────────────────────────
      - name: Cache SDL3 iOS build
        id: cache-sdl3-ios
        uses: actions/cache@v4
        with:
          path: SDL3-ios
          key: sdl3-ios-3.x-${{ hashFiles('.github/workflows/ios-build.yml') }}

      - name: Clone SDL3
        if: steps.cache-sdl3-ios.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch main \
            https://github.com/libsdl-org/SDL.git SDL3-src

      - name: Configure SDL3 for iOS
        if: steps.cache-sdl3-ios.outputs.cache-hit != 'true'
        run: |
          cmake -S SDL3-src -B SDL3-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -G Xcode

      - name: Build SDL3 for iOS
        if: steps.cache-sdl3-ios.outputs.cache-hit != 'true'
        run: |
          cmake --build SDL3-build --config Release -- -sdk iphoneos
          cmake --install SDL3-build --config Release --prefix SDL3-ios

      # ── 4. Configure Fury Clash for iOS ──────────────────────────────────
      - name: Set server URL
        run: |
          SERVER_URL="${{ github.event.inputs.server_url || 'ws://192.168.1.100:3002' }}"
          echo "FC_IOS_SERVER_URL=${SERVER_URL}" >> $GITHUB_ENV
          echo "Building with server URL: ${SERVER_URL}"

      - name: Configure Fury Clash for iOS
        run: |
          cmake -S fury-clash-client -B fury-clash-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSDL3_DIR="${{ github.workspace }}/SDL3-ios/lib/cmake/SDL3" \
            -DFC_IOS_SERVER_URL="${{ env.FC_IOS_SERVER_URL }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -G Xcode

      # ── 5. Build the app (unsigned) ───────────────────────────────────────
      - name: Build Fury Clash iOS app
        run: |
          xcodebuild \
            -project fury-clash-ios/FuryClash.xcodeproj \
            -scheme fury-clash \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            build \
            SYMROOT="${{ github.workspace }}/ios-build-output"

      # ── 5b. Sign app bundle ───────────────────────────────────────────────
      # Skipped automatically if secrets are not configured.
      #
      # Required secrets (repo → Settings → Secrets → Actions):
      #   IOS_CERTIFICATE_P12         Base64-encoded p12 certificate file
      #   IOS_CERTIFICATE_PASSWORD    Password set when exporting the p12
      #   IOS_PROVISIONING_PROFILE    Base64-encoded .mobileprovision file
      #                               Must cover bundle ID: com.furyclash.game
      #
      # How to obtain these (one-time, needs any Mac):
      #   1. Xcode → Settings → Accounts → add your Apple ID
      #   2. Manage Certificates → + → Apple Development  (free account works)
      #   3. Keychain Access → My Certificates → right-click → Export as .p12
      #      base64 -i cert.p12 | pbcopy        → paste as IOS_CERTIFICATE_P12
      #      echo -n "p12password" | pbcopy      → paste as IOS_CERTIFICATE_PASSWORD
      #   4. Connect iPhone, open any Xcode project, build for device once.
      #      Xcode auto-creates a profile in:
      #      ~/Library/MobileDevice/Provisioning Profiles/
      #      base64 -i ~/"Library/MobileDevice/Provisioning Profiles"/*.mobileprovision \
      #        | pbcopy                          → paste as IOS_PROVISIONING_PROFILE
      - name: Sign app bundle
        if: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          # ── Locate built app ──────────────────────────────────────────────
          APP_PATH=$(find ios-build-output fury-clash-ios \
            -name "fury-clash.app" -type d 2>/dev/null | head -1)
          echo "Signing: $APP_PATH"

          # ── Temporary keychain ────────────────────────────────────────────
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          # ── Import p12 certificate ────────────────────────────────────────
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychain -d user -s "$KC"

          # ── Install provisioning profile ──────────────────────────────────
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/decoded_profile.plist"
          PP_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$RUNNER_TEMP/decoded_profile.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"

          # ── Embed provisioning profile inside .app ────────────────────────
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$APP_PATH/embedded.mobileprovision"

          # ── Extract entitlements from profile ─────────────────────────────
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements' "$RUNNER_TEMP/decoded_profile.plist" \
            -x > "$RUNNER_TEMP/entitlements.plist"

          # ── Codesign ──────────────────────────────────────────────────────
          CERT_ID=$(security find-identity -v -p codesigning "$KC" \
            | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "Certificate identity: $CERT_ID"
          codesign --force --sign "$CERT_ID" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp=none \
            "$APP_PATH"

          echo "SIGNED=true" >> $GITHUB_ENV

      # ── 6. Package as .ipa ───────────────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find ios-build-output fury-clash-ios \
            -name "fury-clash.app" -type d 2>/dev/null | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "fury-clash.app not found. Searching workspace:"
            find . -maxdepth 6 -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          mkdir -p ipa-stage/Payload
          cp -r "$APP_PATH" ipa-stage/Payload/fury-clash.app

          cd ipa-stage
          zip -r ../FuryClash.ipa Payload

          echo "IPA created: FuryClash.ipa ($(du -sh ../FuryClash.ipa | cut -f1))"

      # ── 7. Upload artifact ───────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuryClash-iOS-${{ env.SIGNED == 'true' && 'signed' || 'unsigned' }}
          path: FuryClash.ipa
          retention-days: 14

      # ── 8. Print install instructions ────────────────────────────────────
      - name: Print install instructions
        run: |
          echo ""
          echo "=========================================================="
          echo "  IPA build complete!"
          if [ "${SIGNED}" = "true" ]; then
            echo "  Status: SIGNED — install directly with ideviceinstaller"
          else
            echo "  Status: UNSIGNED — needs re-signing on install"
          fi
          echo "=========================================================="
          echo ""
          echo "  Download FuryClash.ipa from the Artifacts section above."
          echo ""
          if [ "${SIGNED}" = "true" ]; then
            echo "  Install signed IPA (Linux):"
            echo "    sudo apt install libimobiledevice-utils"
            echo "    ideviceinstaller -i FuryClash.ipa"
          else
            echo "  Install unsigned IPA (Linux):"
            echo "    Option A — AltServer-Linux:"
            echo "      https://github.com/NyaMisty/AltServer-Linux/releases"
            echo ""
            echo "    Option B — add signing secrets for signed builds:"
            echo "      Repo → Settings → Secrets → Actions:"
            echo "        IOS_CERTIFICATE_P12, IOS_CERTIFICATE_PASSWORD,"
            echo "        IOS_PROVISIONING_PROFILE"
            echo "      See comments in ios-build.yml for how to export them."
          fi
          echo ""
          echo "  Server URL baked in: ${{ env.FC_IOS_SERVER_URL }}"
          echo "  To change: re-run workflow with a different server_url input."
          echo "=========================================================="
